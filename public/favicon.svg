<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="10" fill="#1a1610"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#B8975A" stroke-width="1.5"/>

  <!-- 4 petal Kin flower -->
  <!-- Top petal -->
  <ellipse cx="32" cy="20" rx="5.5" ry="9" fill="#B8975A"/>
  <!-- Bottom petal -->
  <ellipse cx="32" cy="44" rx="5.5" ry="9" fill="#B8975A"/>
  <!-- Left petal -->
  <ellipse cx="20" cy="32" rx="9" ry="5.5" fill="#B8975A"/>
  <!-- Right petal -->
  <ellipse cx="44" cy="32" rx="9" ry="5.5" fill="#B8975A"/>

  <!-- Center circle -->
  <circle cx="32" cy="32" r="7" fill="#1a1610"/>
  <circle cx="32" cy="32" r="4.5" fill="#B8975A"/>

  <!-- Small corner dots (classic Kin detail) -->
  <circle cx="32" cy="9"  r="2" fill="#B8975A"/>
  <circle cx="32" cy="55" r="2" fill="#B8975A"/>
  <circle cx="9"  cy="32" r="2" fill="#B8975A"/>
  <circle cx="55" cy="32" r="2" fill="#B8975A"/>
</svg>
